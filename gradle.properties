org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.0.0
group=com.mever.alchemy_aether_codex

# Dependencies
fabric_api_version=0.116.17+1.21.1

# 镜像源:BMCLAPI 与 Lss233 的 CDN 证书均已损坏, 故 Mojang 走官方源(实测速度正常)
# Fabric 同理走官方源 maven.fabricmc.net(实测可用)。
# 注意: 不要再设 loom_fabric_repository。国内暂无可靠的 Fabric Maven 镜像;
# mirrors.sdu.edu.cn/fabricmc/maven 并非 Maven 仓库, 它对任意路径返回 200+HTML(SPA fallback),
# 会让 Gradle 把 HTML 当成 pom 存下来, 报 "文档中根元素前面的标记必须格式正确"。
# 通用依赖(Central)的加速在 build.gradle 的 repositories 里用阿里云 public 配置。

# 指定 Gradle 使用的 Java 版本
org.gradle.java.home=C:/Users/Meversation/Java/jdk-21
